name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"
          dune-cache: true

      - name: Install dependencies
        run: opam install -y dune alcotest

      - name: Build
        run: opam exec -- dune build

      - name: Run unit tests
        run: opam exec -- dune runtest

      - name: Run example scripts with the ocaml toplevel
        run: |
          for f in 01-basics/*.ml 02-zen/*.ml; do
            echo "::group::$f"
            opam exec -- ocaml "$f" < /dev/null
            echo "::endgroup::"
          done

  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"

      - name: Check formatting
        uses: ocaml/setup-ocaml/lint-fmt@v3
